[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "elio-backend"
version = "0.1.0"
description = "ELIO backend API"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "starlette>=0.46,<1", "uvicorn>=0.30,<1",
 "pyodbc>=5,<6", "pydantic-settings>=2,<3", "python-multipart>=0.0.18,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "jsonschema>=4,<5"]
[project.scripts]
elio-worker = "app.worker:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
"app.contracts" = ["*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
